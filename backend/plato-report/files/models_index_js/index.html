    <textarea id="file-source" class="col-md-12">const { sequelize, Sequelize } = require(&#039;../config/database&#039;);

// Import all models
const User = require(&#039;./User&#039;);
const Teacher = require(&#039;./Teacher&#039;);
const Student = require(&#039;./Student&#039;);
const Class = require(&#039;./Class&#039;);
const Course = require(&#039;./Course&#039;);
const Grade = require(&#039;./Grade&#039;);
const Attendance = require(&#039;./Attendance&#039;);
const Notification = require(&#039;./Notification&#039;);
const Assignment = require(&#039;./Assignment&#039;);
const Question = require(&#039;./Question&#039;);
const Submission = require(&#039;./Submission&#039;);

// Model Associations
// User ↔ Teacher (One-to-One)
// ─────────────────────────────────────────────
User.hasOne(Teacher, {
  foreignKey: &#039;user_id&#039;,
  as: &#039;teacherProfile&#039;,
  onDelete: &#039;CASCADE&#039;
});

Teacher.belongsTo(User, {
  foreignKey: &#039;user_id&#039;,
  as: &#039;user&#039;
});

// ─────────────────────────────────────────────
// 2. User ↔ Student (One-to-One)
// ─────────────────────────────────────────────
User.hasOne(Student, {
  foreignKey: &#039;user_id&#039;,
  as: &#039;studentProfile&#039;,
  onDelete: &#039;CASCADE&#039;
});

Student.belongsTo(User, {
  foreignKey: &#039;user_id&#039;,
  as: &#039;user&#039;
});

// ─────────────────────────────────────────────
// 3. Teacher ↔ Class (One-to-Many)
// ─────────────────────────────────────────────
Teacher.hasMany(Class, {
  foreignKey: &#039;teacher_id&#039;,
  as: &#039;homeroomClasses&#039;,
  onDelete: &#039;SET NULL&#039;
});

Class.belongsTo(Teacher, {
  foreignKey: &#039;teacher_id&#039;,
  as: &#039;homeroomTeacher&#039;
});

// ─────────────────────────────────────────────
// 4. Class ↔ Student (One-to-Many)
// ─────────────────────────────────────────────
Class.hasMany(Student, {
  foreignKey: &#039;class_id&#039;,
  as: &#039;students&#039;,
  onDelete: &#039;SET NULL&#039;
});

Student.belongsTo(Class, {
  foreignKey: &#039;class_id&#039;,
  as: &#039;class&#039;
});

// ─────────────────────────────────────────────
// 5. Class ↔ Course (One-to-Many)
// ─────────────────────────────────────────────
Class.hasMany(Course, {
  foreignKey: &#039;class_id&#039;,
  as: &#039;courses&#039;,
  onDelete: &#039;CASCADE&#039;
});

Course.belongsTo(Class, {
  foreignKey: &#039;class_id&#039;,
  as: &#039;class&#039;
});

// ─────────────────────────────────────────────
// 6. Teacher ↔ Course (One-to-Many)
// ─────────────────────────────────────────────
Teacher.hasMany(Course, {
  foreignKey: &#039;teacher_id&#039;,
  as: &#039;courses&#039;,
  onDelete: &#039;RESTRICT&#039;
});

Course.belongsTo(Teacher, {
  foreignKey: &#039;teacher_id&#039;,
  as: &#039;teacher&#039;
});

// ─────────────────────────────────────────────
// 7. Student ↔ Grade (One-to-Many)
// ─────────────────────────────────────────────
Student.hasMany(Grade, {
  foreignKey: &#039;student_id&#039;,
  as: &#039;grades&#039;,
  onDelete: &#039;CASCADE&#039;
});

Grade.belongsTo(Student, {
  foreignKey: &#039;student_id&#039;,
  as: &#039;student&#039;
});

// ─────────────────────────────────────────────
// 8. Course ↔ Grade (One-to-Many)
// ─────────────────────────────────────────────
Course.hasMany(Grade, {
  foreignKey: &#039;course_id&#039;,
  as: &#039;grades&#039;,
  onDelete: &#039;CASCADE&#039;
});

Grade.belongsTo(Course, {
  foreignKey: &#039;course_id&#039;,
  as: &#039;course&#039;
});

// ─────────────────────────────────────────────
// 9. Student ↔ Attendance (One-to-Many)
// ─────────────────────────────────────────────
Student.hasMany(Attendance, {
  foreignKey: &#039;student_id&#039;,
  as: &#039;attendance&#039;,
  onDelete: &#039;CASCADE&#039;
});

Attendance.belongsTo(Student, {
  foreignKey: &#039;student_id&#039;,
  as: &#039;student&#039;
});

// ─────────────────────────────────────────────
// 10. Course ↔ Attendance (One-to-Many, optional)
// ─────────────────────────────────────────────
Course.hasMany(Attendance, {
  foreignKey: &#039;course_id&#039;,
  as: &#039;attendance&#039;,
  onDelete: &#039;SET NULL&#039;
});

Attendance.belongsTo(Course, {
  foreignKey: &#039;course_id&#039;,
  as: &#039;course&#039;
});

// ─────────────────────────────────────────────
// 11. User ↔ Attendance (marked_by)
// ─────────────────────────────────────────────
User.hasMany(Attendance, {
  foreignKey: &#039;marked_by&#039;,
  as: &#039;markedAttendance&#039;,
  onDelete: &#039;SET NULL&#039;
});

Attendance.belongsTo(User, {
  foreignKey: &#039;marked_by&#039;,
  as: &#039;marker&#039;
});

// ─────────────────────────────────────────────
// 12. User ↔ Notification (One-to-Many)
// ─────────────────────────────────────────────
User.hasMany(Notification, {
  foreignKey: &#039;user_id&#039;,
  as: &#039;notifications&#039;,
  onDelete: &#039;CASCADE&#039;
});

Notification.belongsTo(User, {
  foreignKey: &#039;user_id&#039;,
  as: &#039;user&#039;
});

// ─────────────────────────────────────────────
// 13. Course ↔ Assignment (One-to-Many)
// ─────────────────────────────────────────────
Course.hasMany(Assignment, {
  foreignKey: &#039;course_id&#039;,
  as: &#039;assignments&#039;,
  onDelete: &#039;CASCADE&#039;
});

Assignment.belongsTo(Course, {
  foreignKey: &#039;course_id&#039;,
  as: &#039;course&#039;
});

// ─────────────────────────────────────────────
// 14. Teacher ↔ Assignment (One-to-Many)
// ─────────────────────────────────────────────
Teacher.hasMany(Assignment, {
  foreignKey: &#039;teacher_id&#039;,
  as: &#039;assignments&#039;,
  onDelete: &#039;RESTRICT&#039;
});

Assignment.belongsTo(Teacher, {
  foreignKey: &#039;teacher_id&#039;,
  as: &#039;teacher&#039;
});

// ─────────────────────────────────────────────
// 15. Assignment ↔ Question (One-to-Many)
// ─────────────────────────────────────────────
Assignment.hasMany(Question, {
  foreignKey: &#039;assignment_id&#039;,
  as: &#039;questions&#039;,
  onDelete: &#039;CASCADE&#039;
});

Question.belongsTo(Assignment, {
  foreignKey: &#039;assignment_id&#039;,
  as: &#039;assignment&#039;
});

// ─────────────────────────────────────────────
// 16. Assignment ↔ Submission (One-to-Many)
// ─────────────────────────────────────────────
Assignment.hasMany(Submission, {
  foreignKey: &#039;assignment_id&#039;,
  as: &#039;submissions&#039;,
  onDelete: &#039;CASCADE&#039;
});

Submission.belongsTo(Assignment, {
  foreignKey: &#039;assignment_id&#039;,
  as: &#039;assignment&#039;
});

// ─────────────────────────────────────────────
// 17. Student ↔ Submission (One-to-Many)
// ─────────────────────────────────────────────
Student.hasMany(Submission, {
  foreignKey: &#039;student_id&#039;,
  as: &#039;submissions&#039;,
  onDelete: &#039;CASCADE&#039;
});

Submission.belongsTo(Student, {
  foreignKey: &#039;student_id&#039;,
  as: &#039;student&#039;
});

// ─────────────────────────────────────────────
// 18. Teacher ↔ Submission (graded_by)
// ─────────────────────────────────────────────
Teacher.hasMany(Submission, {
  foreignKey: &#039;graded_by&#039;,
  as: &#039;gradedSubmissions&#039;,
  onDelete: &#039;SET NULL&#039;
});

Submission.belongsTo(Teacher, {
  foreignKey: &#039;graded_by&#039;,
  as: &#039;grader&#039;
});

module.exports = {
  sequelize,
  Sequelize,

  // Core Models
  User,
  Teacher,
  Student,

  // Academic Models
  Class,
  Course,
  Grade,
  Attendance,

  // Assignment Models
  Assignment,
  Question,
  Submission,

  // Notification Model
  Notification
};</textarea>
