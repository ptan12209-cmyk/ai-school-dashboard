<div class="container">
  <div class="row">
    <textarea id="file-source" class="col-md-12">const express = require(&#039;express&#039;);
const router = express.Router();
const { body } = require(&#039;express-validator&#039;);
const studentController = require(&#039;../controllers/studentController&#039;);
const { verifyToken, checkRole } = require(&#039;../middleware/authMiddleware&#039;);
const { validate } = require(&#039;../middleware/validation&#039;);

/**
 * All routes require authentication
 */
router.use(verifyToken);

/**
 * @route   GET /api/students/stats
 * @desc    Get student statistics
 * @access  Admin only
 */
router.get(&#039;/stats&#039;,
  checkRole(&#039;admin&#039;),
  studentController.getStudentStats
);

/**
 * @route   GET /api/students/unassigned
 * @desc    Get students without a class
 * @access  Teacher, Admin
 */
router.get(&#039;/unassigned&#039;,
  checkRole(&#039;admin&#039;, &#039;teacher&#039;),
  studentController.getUnassignedStudents
);

/**
 * @route   GET /api/students
 * @desc    Get all students (with pagination, filtering, search)
 * @access  Teacher, Admin
 * @query   page, limit, gender, class_id, unassigned, search, sort
 */
router.get(&#039;/&#039;,
  checkRole(&#039;admin&#039;, &#039;teacher&#039;),
  studentController.getAllStudents
);

/**
 * @route   POST /api/students
 * @desc    Create new student
 * @access  Admin only
 */
router.post(&#039;/&#039;,
  checkRole(&#039;admin&#039;),
  [
    body(&#039;email&#039;)
      .isEmail()
      .withMessage(&#039;Must be a valid email&#039;)
      .normalizeEmail(),
    
    body(&#039;password&#039;)
      .isLength({ min: 8 })
      .withMessage(&#039;Password must be at least 8 characters&#039;)
      .matches(/[A-Z]/)
      .withMessage(&#039;Password must contain at least one uppercase letter&#039;)
      .matches(/[a-z]/)
      .withMessage(&#039;Password must contain at least one lowercase letter&#039;)
      .matches(/[0-9]/)
      .withMessage(&#039;Password must contain at least one number&#039;),
    
    body(&#039;firstName&#039;)
      .trim()
      .notEmpty()
      .withMessage(&#039;First name is required&#039;)
      .isLength({ min: 1, max: 100 })
      .withMessage(&#039;First name must be 1-100 characters&#039;),
    
    body(&#039;lastName&#039;)
      .trim()
      .notEmpty()
      .withMessage(&#039;Last name is required&#039;)
      .isLength({ min: 1, max: 100 })
      .withMessage(&#039;Last name must be 1-100 characters&#039;),
    
    body(&#039;dateOfBirth&#039;)
      .notEmpty()
      .withMessage(&#039;Date of birth is required&#039;)
      .isISO8601()
      .withMessage(&#039;Date of birth must be a valid date&#039;),
    
    body(&#039;gender&#039;)
      .optional()
      .isIn([&#039;M&#039;, &#039;F&#039;, &#039;Other&#039;])
      .withMessage(&#039;Gender must be M, F, or Other&#039;),
    
    body(&#039;phone&#039;)
      .optional()
      .matches(/^[0-9\s\-\+\(\)]*$/)
      .withMessage(&#039;Phone number contains invalid characters&#039;),
    
    body(&#039;address&#039;)
      .optional()
      .trim()
      .isLength({ max: 255 })
      .withMessage(&#039;Address must be less than 255 characters&#039;),
    
    body(&#039;parentName&#039;)
      .optional()
      .trim()
      .isLength({ min: 1, max: 100 })
      .withMessage(&#039;Parent name must be 1-100 characters&#039;),
    
    body(&#039;parentPhone&#039;)
      .optional()
      .matches(/^[0-9\s\-\+\(\)]*$/)
      .withMessage(&#039;Parent phone contains invalid characters&#039;),
    
    body(&#039;parentEmail&#039;)
      .optional()
      .isEmail()
      .withMessage(&#039;Must be a valid email&#039;)
      .normalizeEmail(),
    
    body(&#039;classId&#039;)
      .optional()
      .isUUID()
      .withMessage(&#039;Class ID must be a valid UUID&#039;)
  ],
  validate,
  studentController.createStudent
);

/**
 * @route   GET /api/students/:id
 * @desc    Get student by ID
 * @access  Teacher, Admin, or Self
 */
router.get(&#039;/:id&#039;,
  studentController.getStudentById
);

/**
 * @route   PUT /api/students/:id
 * @desc    Update student
 * @access  Admin or Self (limited fields for self)
 */
router.put(&#039;/:id&#039;,
  [
    body(&#039;firstName&#039;)
      .optional()
      .trim()
      .isLength({ min: 1, max: 100 })
      .withMessage(&#039;First name must be 1-100 characters&#039;),
    
    body(&#039;lastName&#039;)
      .optional()
      .trim()
      .isLength({ min: 1, max: 100 })
      .withMessage(&#039;Last name must be 1-100 characters&#039;),
    
    body(&#039;dateOfBirth&#039;)
      .optional()
      .isISO8601()
      .withMessage(&#039;Date of birth must be a valid date&#039;),
    
    body(&#039;gender&#039;)
      .optional()
      .isIn([&#039;M&#039;, &#039;F&#039;, &#039;Other&#039;])
      .withMessage(&#039;Gender must be M, F, or Other&#039;),
    
    body(&#039;phone&#039;)
      .optional()
      .matches(/^[0-9\s\-\+\(\)]*$/)
      .withMessage(&#039;Phone number contains invalid characters&#039;),
    
    body(&#039;address&#039;)
      .optional()
      .trim()
      .isLength({ max: 255 })
      .withMessage(&#039;Address must be less than 255 characters&#039;),
    
    body(&#039;parentName&#039;)
      .optional()
      .trim()
      .isLength({ min: 1, max: 100 })
      .withMessage(&#039;Parent name must be 1-100 characters&#039;),
    
    body(&#039;parentPhone&#039;)
      .optional()
      .matches(/^[0-9\s\-\+\(\)]*$/)
      .withMessage(&#039;Parent phone contains invalid characters&#039;),
    
    body(&#039;parentEmail&#039;)
      .optional()
      .isEmail()
      .withMessage(&#039;Must be a valid email&#039;)
      .normalizeEmail(),
    
    body(&#039;classId&#039;)
      .optional()
      .isUUID()
      .withMessage(&#039;Class ID must be a valid UUID&#039;)
  ],
  validate,
  studentController.updateStudent
);

/**
 * @route   DELETE /api/students/:id
 * @desc    Delete student (soft delete)
 * @access  Admin only
 */
router.delete(&#039;/:id&#039;,
  checkRole(&#039;admin&#039;),
  studentController.deleteStudent
);

/**
 * @route   GET /api/students/:id/grade
 * @desc    Get student&#039;s grades
 * @access  Student (self), Teacher, Admin
 * @note    Will be implemented in Day 5
 */
router.get(&#039;/:id/grade&#039;,
  studentController.getStudentGrades
);

module.exports = router;</textarea>
