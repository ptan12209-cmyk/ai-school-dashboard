    <textarea id="file-source" class="col-md-12">/**
 * Notification Controller
 * =======================
 * Handles notification CRUD operations and status management
 */

const { Notification } = require(&#039;../models&#039;);
const notificationService = require(&#039;../services/notificationService&#039;);
const { catchAsync } = require(&#039;../middleware/errorHandler&#039;);

/**
 * Get user notifications with pagination
 * GET /api/notifications
 */
exports.getUserNotifications = catchAsync(async (req, res) =&gt; {
  const userId = req.user.id;
  const { page = 1, limit = 20, filter } = req.query;

  const options = {
    page: parseInt(page),
    limit: parseInt(limit)
  };

  // Apply filters
  if (filter === &#039;unread&#039;) {
    options.unreadOnly = true;
  } else if (filter === &#039;read&#039;) {
    options.readOnly = true;
  }

  const result = await notificationService.getUserNotifications(userId, options);

  res.json({
    success: true,
    data: result.notifications,
    pagination: {
      total: result.total,
      page: result.page,
      limit: result.limit,
      totalPages: result.totalPages
    }
  });
});

/**
 * Get unread notification count
 * GET /api/notifications/unread/count
 */
exports.getUnreadCount = catchAsync(async (req, res) =&gt; {
  const userId = req.user.id;
  const count = await Notification.getUnreadCount(userId);

  res.json({
    success: true,
    data: { count }
  });
});

/**
 * Get single notification
 * GET /api/notifications/:id
 */
exports.getNotification = catchAsync(async (req, res) =&gt; {
  const userId = req.user.id;
  const { id } = req.params;

  const notification = await Notification.findOne({
    where: {
      id,
      user_id: userId
    }
  });

  if (!notification) {
    return res.status(404).json({
      success: false,
      message: &#039;Không tìm thấy thông báo&#039;
    });
  }

  res.json({
    success: true,
    data: notification
  });
});

/**
 * Mark notification as read
 * PUT /api/notifications/:id/read
 */
exports.markAsRead = catchAsync(async (req, res) =&gt; {
  const userId = req.user.id;
  const { id } = req.params;

  const notification = await notificationService.markAsRead(id, userId);

  if (!notification) {
    return res.status(404).json({
      success: false,
      message: &#039;Không tìm thấy thông báo&#039;
    });
  }

  // Get updated unread count
  const count = await Notification.getUnreadCount(userId);

  // Emit real-time update
  const io = req.app.locals.io;
  if (io) {
    io.emitToUser(userId, &#039;notification_count&#039;, count);
  }

  res.json({
    success: true,
    data: notification,
    unreadCount: count
  });
});

/**
 * Mark all notifications as read
 * PUT /api/notifications/read-all
 */
exports.markAllAsRead = catchAsync(async (req, res) =&gt; {
  const userId = req.user.id;

  const count = await notificationService.markAllAsRead(userId);

  // Emit real-time update
  const io = req.app.locals.io;
  if (io) {
    io.emitToUser(userId, &#039;notification_count&#039;, 0);
    io.emitToUser(userId, &#039;all_notifications_read&#039;);
  }

  res.json({
    success: true,
    data: {
      markedCount: count,
      unreadCount: 0
    }
  });
});

/**
 * Delete notification
 * DELETE /api/notifications/:id
 */
exports.deleteNotification = catchAsync(async (req, res) =&gt; {
  const userId = req.user.id;
  const { id } = req.params;

  const notification = await Notification.findOne({
    where: {
      id,
      user_id: userId
    }
  });

  if (!notification) {
    return res.status(404).json({
      success: false,
      message: &#039;Không tìm thấy thông báo&#039;
    });
  }

  await notification.destroy();

  // Get updated unread count
  const count = await Notification.getUnreadCount(userId);

  // Emit real-time update
  const io = req.app.locals.io;
  if (io) {
    io.emitToUser(userId, &#039;notification_count&#039;, count);
    io.emitToUser(userId, &#039;notification_deleted&#039;, id);
  }

  res.json({
    success: true,
    message: &#039;Đã xóa thông báo&#039;,
    unreadCount: count
  });
});

/**
 * Delete all read notifications
 * DELETE /api/notifications/read
 */
exports.deleteReadNotifications = catchAsync(async (req, res) =&gt; {
  const userId = req.user.id;

  const result = await Notification.destroy({
    where: {
      user_id: userId,
      is_read: true
    }
  });

  res.json({
    success: true,
    message: `Đã xóa ${result} thông báo đã đọc`,
    deletedCount: result
  });
});

/**
 * Create test notification (for development/testing)
 * POST /api/notifications/test
 */
exports.createTestNotification = catchAsync(async (req, res) =&gt; {
  const userId = req.user.id;
  const io = req.app.locals.io;

  const notification = await notificationService.createNotification({
    user_id: userId,
    type: &#039;system&#039;,
    title: &#039;Thông Báo Test&#039;,
    message: &#039;Đây là thông báo test từ hệ thống&#039;,
    priority: &#039;medium&#039;
  }, {
    io,
    sendEmail: false,
    sendPush: false
  });

  res.json({
    success: true,
    message: &#039;Đã tạo thông báo test&#039;,
    data: notification
  });
});</textarea>
