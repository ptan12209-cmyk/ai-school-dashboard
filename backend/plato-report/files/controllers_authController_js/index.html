    <textarea id="file-source" class="col-md-12">const { User, Teacher, Student } = require(&#039;../models&#039;);

/**
 * @route   POST /api/auth/register
 * @desc    Register a new user
 * @access  Public
 */
exports.register = async (req, res, next) =&gt; {
  try {
    const { 
      email, 
      password, 
      role, 
      firstName, 
      lastName,
      dateOfBirth,
      gender,
      department,
      phone,
      parentName,
      parentPhone,
      parentEmail
    } = req.body;
    
    // Validate required fields first
    if (!email || !password) {
      return res.status(400).json({
        success: false,
        message: &#039;Email and password are required&#039;
      });
    }
    // Normalize email to lowercase and trim whitespace to prevent duplicates
    const trimmedEmail = email.toLowerCase().trim();

    // Check if user already exists
    const existingUser = await User.findOne({ where: { email: trimmedEmail } });
    if (existingUser) {
      return res.status(409).json({
        success: false,
        message: &#039;Email already exists&#039;
      });
    }
    
    // Validate password strength
    const passwordValidation = User.validatePassword(password);
    if (!passwordValidation.valid) {
      return res.status(400).json({
        success: false,
        message: &#039;Password does not meet requirements&#039;,
        errors: passwordValidation.errors
      });
    }
    
    // Create user
    const user = await User.create({
      email: trimmedEmail,
      password_hash: password, // Will be hashed by beforeCreate hook
      role: role || &#039;student&#039;,
      is_active: true
    });
    
    // Create profile based on role
    let profile = null;
    
    try {
      if (role === &#039;teacher&#039; &amp;&amp; firstName &amp;&amp; lastName) {
        profile = await Teacher.create({
          user_id: user.id,
          first_name: firstName,
          last_name: lastName,
          department: department || null,
          phone: phone || null,
          hire_date: new Date()
        });
      } else if (role === &#039;student&#039; &amp;&amp; firstName &amp;&amp; lastName &amp;&amp; dateOfBirth) {
        profile = await Student.create({
          user_id: user.id,
          first_name: firstName,
          last_name: lastName,
          date_of_birth: dateOfBirth,
          gender: gender || null,
          phone: phone || null,
          parent_name: parentName || null,
          parent_phone: parentPhone || null,
          parent_email: parentEmail || null
        });
      }
    } catch (profileError) {
      // Rollback user creation if profile creation fails
      await user.destroy();
      
      return res.status(400).json({
        success: false,
        message: profileError.message || &#039;Failed to create user profile&#039;
      });
    }
    
    // Generate token
    const token = user.generateToken();
    
    res.status(201).json({
      success: true,
      message: &#039;User registered successfully&#039;,
      data: {
        user: {
          id: user.id,
          email: user.email,
          role: user.role
        },
        profile,
        token
      }
    });
    
  } catch (error) {
    console.error(&#039;Register error:&#039;, error);
    
    // Handle Sequelize validation errors
    if (error.name === &#039;SequelizeValidationError&#039;) {
      return res.status(400).json({
        success: false,
        message: &#039;Validation error&#039;,
        errors: error.errors.map(e =&gt; ({
          field: e.path,
          message: e.message
        }))
      });
    }
    
    // Handle unique constraint errors
    if (error.name === &#039;SequelizeUniqueConstraintError&#039;) {
      return res.status(409).json({
        success: false,
        message: &#039;Email already exists&#039;
      });
    }
    
    res.status(500).json({
      success: false,
      message: &#039;Server error during registration&#039;,
      error: process.env.NODE_ENV === &#039;development&#039; ? error.message : undefined
    });
  }
};

/**
 * @route   POST /api/auth/login
 * @desc    Login user and return token
 * @access  Public
 */
exports.login = async (req, res, next) =&gt; {
  try {
    const { email, password } = req.body;
    
    // âœ… COMPREHENSIVE VALIDATION
    // Return 400 (validation error) for missing fields
    if (!email || !password) {
      return res.status(400).json({
        success: false,
        message: &#039;Email and password are required&#039;
      });
    }

    // Normalize email to lowercase and trim whitespace
    const normalizedEmail = email.toLowerCase().trim();

    // Find user with password (using withPassword scope)
    const user = await User.findByEmail(normalizedEmail);
    if (!user) {
      // Return 401 for invalid credentials (user not found)
      return res.status(401).json({
        success: false,
        message: &#039;Invalid email or password&#039;
      });
    }
    
    // Check if account is active
    if (!user.is_active) {
      return res.status(403).json({
        success: false,
        message: &#039;Account is inactive. Please contact administrator.&#039;
      });
    }
    
    // Verify password
    const isValidPassword = await user.comparePassword(password);
    
    if (!isValidPassword) {
      return res.status(401).json({
        success: false,
        message: &#039;Invalid email or password&#039;
      });
    }
    
    // Get user profile based on role
    let profile = null;
    
    if (user.role === &#039;teacher&#039;) {
      profile = await Teacher.findOne({ where: { user_id: user.id } });
    } else if (user.role === &#039;student&#039;) {
      profile = await Student.findOne({ where: { user_id: user.id } });
    }
    
    // Generate token
    const token = user.generateToken();
    
    res.json({
      success: true,
      message: &#039;Login successful&#039;,
      data: {
        user: {
          id: user.id,
          email: user.email,
          role: user.role,
          is_active: user.is_active
        },
        profile: profile ? {
          id: profile.id,
          firstName: profile.first_name,
          lastName: profile.last_name,
          fullName: profile.getFullName ? profile.getFullName() : `${profile.first_name} ${profile.last_name}`
        } : null,
        token
      }
    });
    
  } catch (error) {
    console.error(&#039;Login error:&#039;, error);
    
    res.status(500).json({
      success: false,
      message: &#039;Server error during login&#039;,
      error: process.env.NODE_ENV === &#039;development&#039; ? error.message : undefined
    });
  }
};

/**
 * @route   GET /api/auth/me
 * @desc    Get current user profile
 * @access  Private (requires authentication)
 */
exports.getCurrentUser = async (req, res, next) =&gt; {
  try {
    // User is already attached to req by authMiddleware
    const userId = req.user.id;
    
    // Fetch user with profile
    const user = await User.findByPk(userId, {
      attributes: [&#039;id&#039;, &#039;email&#039;, &#039;role&#039;, &#039;is_active&#039;, &#039;created_at&#039;]
    });
    
    if (!user) {
      return res.status(404).json({
        success: false,
        message: &#039;User not found&#039;
      });
    }
    
    // Get profile based on role
    let profile = null;
    
    if (user.role === &#039;teacher&#039;) {
      profile = await Teacher.findOne({ 
        where: { user_id: user.id }
      });
    } else if (user.role === &#039;student&#039;) {
      profile = await Student.findOne({ 
        where: { user_id: user.id }
      });
    }
    
    res.json({
      success: true,
      data: {
        user: user.toJSON(),
        profile: profile ? profile.toJSON() : null
      }
    });
    
  } catch (error) {
    console.error(&#039;Get current user error:&#039;, error);
    
    res.status(500).json({
      success: false,
      message: &#039;Server error&#039;,
      error: process.env.NODE_ENV === &#039;development&#039; ? error.message : undefined
    });
  }
};

/**
 * @route   POST /api/auth/logout
 * @desc    Logout user (client-side should delete token)
 * @access  Private
 */
exports.logout = async (req, res, next) =&gt; {
  try {
    // With JWT, logout is handled client-side by deleting the token
    // This endpoint is mainly for logging/tracking purposes
    
    res.json({
      success: true,
      message: &#039;Logout successful&#039;,
      data: {
        loggedOut: true,
        timestamp: new Date().toISOString()
      }
    });
    
  } catch (error) {
    console.error(&#039;Logout error:&#039;, error);
    
    res.status(500).json({
      success: false,
      message: &#039;Server error&#039;,
      error: process.env.NODE_ENV === &#039;development&#039; ? error.message : undefined
    });
  }
};

/**
 * @route   POST /api/auth/refresh-token
 * @desc    Refresh access token
 * @access  Private
 */
exports.refreshToken = async (req, res, next) =&gt; {
  try {
    // User is already authenticated via authMiddleware
    const userId = req.user.id;
    
    const user = await User.findByPk(userId);
    
    if (!user || !user.is_active) {
      return res.status(401).json({
        success: false,
        message: &#039;User not found or inactive&#039;
      });
    }
    
    // Generate new token
    const token = user.generateToken();
    
    res.json({
      success: true,
      data: { token }
    });
    
  } catch (error) {
    console.error(&#039;Refresh token error:&#039;, error);
    
    res.status(500).json({
      success: false,
      message: &#039;Server error&#039;,
      error: process.env.NODE_ENV === &#039;development&#039; ? error.message : undefined
    });
  }
};

module.exports = exports;</textarea>
