    <textarea id="file-source" class="col-md-12">/**
 * Notification Service
 * ====================
 * Handles creation and delivery of notifications
 */

const Notification = require(&#039;../models/Notification&#039;);
const emailService = require(&#039;./emailService&#039;);

class NotificationService {
  /**
   * Create and send a notification
   * @param {Object} data - Notification data
   * @param {String} data.userId - Recipient user ID
   * @param {String} data.type - Notification type
   * @param {String} data.title - Notification title
   * @param {String} data.message - Notification message
   * @param {Object} options - Additional options
   */
  async createNotification(data, options = {}) {
    try {
      const {
        userId,
        user_id, // Support both userId and user_id for backward compatibility
        type = &#039;system&#039;,
        title,
        message,
        relatedType,
        relatedId,
        priority = &#039;medium&#039;,
        metadata = {},
        expiresAt
      } = data;

      // Use userId if provided, otherwise fall back to user_id
      const recipientUserId = userId || user_id;

      // Create notification in database
      const notification = await Notification.create({
        user_id: recipientUserId,
        type,
        title,
        message,
        related_type: relatedType,
        related_id: relatedId,
        priority,
        metadata,
        expires_at: expiresAt
      });

      // Send email if requested
      if (options.sendEmail) {
        await this.sendEmailNotification(notification, options.user);
      }

      // Emit real-time notification via Socket.io
      if (options.io &amp;&amp; options.io.to) {
        this.emitRealTimeNotification(options.io, recipientUserId, notification);
      }

      return notification;
    } catch (error) {
      console.error(&#039;Error creating notification:&#039;, error);
      throw error;
    }
  }

  /**
   * Create notifications for multiple users
   * @param {Array} recipients - Array of user IDs or user objects
   * @param {Object} data - Notification data
   * @param {Object} options - Options including sendEmail
   */
  async createBulkNotifications(recipients, data, options = {}) {
    const notifications = [];

    for (const recipient of recipients) {
      // Handle both user IDs and user objects
      const userId = typeof recipient === &#039;object&#039; ? recipient.id : recipient;
      const userObject = typeof recipient === &#039;object&#039; ? recipient : null;

      const notification = await this.createNotification(
        { ...data, userId },
        { ...options, user: userObject }
      );
      notifications.push(notification);
    }

    return notifications;
  }

  /**
   * Send email notification
   */
  async sendEmailNotification(notification, user) {
    try {
      if (!user || !user.email) {
        console.warn(&#039;Cannot send email: user or email not provided&#039;);
        return;
      }

      const emailData = {
        to: user.email,
        subject: notification.title,
        type: notification.type,
        data: {
          title: notification.title,
          message: notification.message,
          userName: `${user.firstName} ${user.lastName}`,
          priority: notification.priority,
          createdAt: notification.created_at
        }
      };

      await emailService.sendNotificationEmail(emailData);
      await notification.markEmailSent();

      return true;
    } catch (error) {
      console.error(&#039;Error sending email notification:&#039;, error);
      return false;
    }
  }

  /**
   * Emit real-time notification via Socket.io
   */
  emitRealTimeNotification(io, userId, notification) {
    try {
      io.to(`user_${userId}`).emit(&#039;new_notification&#039;, {
        id: notification.id,
        type: notification.type,
        title: notification.title,
        message: notification.message,
        priority: notification.priority,
        createdAt: notification.created_at,
        metadata: notification.metadata
      });

      console.log(`✅ Real-time notification sent to user ${userId}`);
    } catch (error) {
      console.error(&#039;Error emitting real-time notification:&#039;, error);
    }
  }

  /**
   * Get user notifications with pagination
   */
  async getUserNotifications(userId, options = {}) {
    const {
      page = 1,
      limit = 20,
      unreadOnly = false,
      type = null
    } = options;

    const where = { user_id: userId };

    if (unreadOnly) {
      where.is_read = false;
    }

    if (type) {
      where.type = type;
    }

    const offset = (page - 1) * limit;

    const { count, rows } = await Notification.findAndCountAll({
      where,
      order: [[&#039;created_at&#039;, &#039;DESC&#039;]],
      limit,
      offset
    });

    return {
      notifications: rows,
      total: count,
      page,
      totalPages: Math.ceil(count / limit),
      hasMore: offset + rows.length &lt; count
    };
  }

  /**
   * Mark notification as read
   */
  async markAsRead(notificationId, userId) {
    const notification = await Notification.findOne({
      where: {
        id: notificationId,
        user_id: userId
      }
    });

    if (!notification) {
      throw new Error(&#039;Notification not found&#039;);
    }

    return await notification.markAsRead();
  }

  /**
   * Mark all notifications as read for user
   */
  async markAllAsRead(userId) {
    return await Notification.markAllAsRead(userId);
  }

  /**
   * Delete notification
   */
  async deleteNotification(notificationId, userId) {
    const result = await Notification.destroy({
      where: {
        id: notificationId,
        user_id: userId
      }
    });

    return result &gt; 0;
  }

  /**
   * Get unread count
   */
  async getUnreadCount(userId) {
    return await Notification.getUnreadCount(userId);
  }

  /**
   * Notification type helpers
   */

  // Grade posted notification
  async notifyGradePosted(studentId, gradeData, options = {}) {
    return await this.createNotification({
      userId: studentId,
      type: &#039;grade_posted&#039;,
      title: &#039;Điểm Số Mới&#039;,
      message: `Bạn nhận được điểm ${gradeData.score} cho môn ${gradeData.subject}`,
      relatedType: &#039;grade&#039;,
      relatedId: gradeData.gradeId,
      priority: &#039;medium&#039;,
      metadata: { grade: gradeData.score, subject: gradeData.subject }
    }, options);
  }

  // Attendance marked notification
  async notifyAttendanceMarked(studentId, attendanceData, options = {}) {
    const isAbsent = attendanceData.status === &#039;absent&#039;;

    return await this.createNotification({
      userId: studentId,
      type: &#039;attendance_marked&#039;,
      title: isAbsent ? &#039;Thông Báo Vắng Mặt&#039; : &#039;Điểm Danh&#039;,
      message: isAbsent
        ? `Bạn đã vắng mặt buổi học ${attendanceData.subject} ngày ${attendanceData.date}`
        : `Điểm danh buổi học ${attendanceData.subject} ngày ${attendanceData.date}`,
      relatedType: &#039;attendance&#039;,
      relatedId: attendanceData.attendanceId,
      priority: isAbsent ? &#039;high&#039; : &#039;low&#039;,
      metadata: attendanceData
    }, options);
  }

  // Assignment due notification
  async notifyAssignmentDue(studentId, assignmentData, options = {}) {
    return await this.createNotification({
      userId: studentId,
      type: &#039;assignment_due&#039;,
      title: &#039;Nhắc Nhở Nộp Bài&#039;,
      message: `Bài tập ${assignmentData.name} sắp đến hạn: ${assignmentData.dueDate}`,
      relatedType: &#039;assignment&#039;,
      relatedId: assignmentData.assignmentId,
      priority: &#039;high&#039;,
      metadata: assignmentData
    }, options);
  }

  // System announcement
  async notifyAnnouncement(userIds, announcementData, options = {}) {
    return await this.createBulkNotifications(
      userIds,
      {
        type: &#039;announcement&#039;,
        title: announcementData.title,
        message: announcementData.message,
        priority: announcementData.priority || &#039;medium&#039;,
        metadata: announcementData
      },
      options
    );
  }

  // Alert notification
  async notifyAlert(userId, alertData, options = {}) {
    return await this.createNotification({
      userId,
      type: &#039;alert&#039;,
      title: alertData.title,
      message: alertData.message,
      priority: &#039;urgent&#039;,
      metadata: alertData
    }, { ...options, sendEmail: options.sendEmail || false });
  }
}

module.exports = new NotificationService();</textarea>
