<div class="container">
  <div class="row">
    <textarea id="file-source" class="col-md-12">const express = require(&#039;express&#039;);
const router = express.Router();
const { body } = require(&#039;express-validator&#039;);
const userController = require(&#039;../controllers/userController&#039;);
const { verifyToken, checkRole } = require(&#039;../middleware/authMiddleware&#039;);
const { validate } = require(&#039;../middleware/validation&#039;);

/**
 * Apply authentication to all routes
 */
router.use(verifyToken);

/**
 * @route   GET /api/users/stats
 * @desc    Get user statistics
 * @access  Admin only
 */
router.get(&#039;/stats&#039;, 
  checkRole(&#039;admin&#039;),
  userController.getUserStats
);

/**
 * @route   GET /api/users
 * @desc    Get all users (with pagination, filtering, search)
 * @access  Admin only
 * @query   page, limit, role, is_active, search, sort
 */
router.get(&#039;/&#039;, 
  checkRole(&#039;admin&#039;),
  userController.getAllUsers
);

/**
 * @route   PATCH /api/users/:id/activate
 * @desc    Activate user account
 * @access  Admin only
 */
router.patch(&#039;/:id/activate&#039;,
  checkRole(&#039;admin&#039;),
  userController.activateUser
);

/**
 * @route   PATCH /api/users/:id/deactivate
 * @desc    Deactivate user account
 * @access  Admin only
 */
router.patch(&#039;/:id/deactivate&#039;,
  checkRole(&#039;admin&#039;),
  userController.deactivateUser
);

/**
 * @route   GET /api/users/:id
 * @desc    Get user by ID
 * @access  Admin or Self
 */
router.get(&#039;/:id&#039;,
  userController.getUserById
);

/**
 * @route   PUT /api/users/:id
 * @desc    Update user
 * @access  Admin or Self (limited fields for self)
 */
router.put(&#039;/:id&#039;,
  [
    body(&#039;email&#039;)
      .optional()
      .isEmail()
      .withMessage(&#039;Must be a valid email&#039;)
      .normalizeEmail(),
    
    body(&#039;role&#039;)
      .optional()
      .isIn([&#039;admin&#039;, &#039;teacher&#039;, &#039;student&#039;])
      .withMessage(&#039;Role must be admin, teacher, or student&#039;),
    
    body(&#039;is_active&#039;)
      .optional()
      .isBoolean()
      .withMessage(&#039;is_active must be a boolean&#039;)
  ],
  validate,
  userController.updateUser
);

/**
 * @route   DELETE /api/users/:id
 * @desc    Delete user (soft delete)
 * @access  Admin only
 */
router.delete(&#039;/:id&#039;,
  checkRole(&#039;admin&#039;),
  userController.deleteUser
);

module.exports = router;</textarea>
