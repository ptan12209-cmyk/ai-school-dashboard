    <textarea id="file-source" class="col-md-12">/**
 * Notification Model
 * ==================
 * Manages system notifications for users
 */

const { DataTypes } = require(&#039;sequelize&#039;);
const { sequelize } = require(&#039;../config/database&#039;);

const Notification = sequelize.define(&#039;Notification&#039;, {
  id: {
    type: DataTypes.UUID,
    defaultValue: DataTypes.UUIDV4,
    primaryKey: true
  },

  // Recipient user ID
  user_id: {
    type: DataTypes.UUID,
    allowNull: false,
    references: {
      model: &#039;users&#039;,
      key: &#039;id&#039;
    },
    onDelete: &#039;CASCADE&#039;
  },

  // Notification type
  type: {
    type: DataTypes.ENUM(
      &#039;grade_posted&#039;,        // Điểm số mới
      &#039;attendance_marked&#039;,   // Điểm danh
      &#039;assignment_due&#039;,      // Hạn nộp bài
      &#039;assignment&#039;,          // Bài tập mới/nộp bài
      &#039;announcement&#039;,        // Thông báo chung
      &#039;message&#039;,            // Tin nhắn
      &#039;alert&#039;,              // Cảnh báo
      &#039;system&#039;              // Hệ thống
    ),
    allowNull: false,
    defaultValue: &#039;system&#039;
  },

  // Notification title
  title: {
    type: DataTypes.STRING(255),
    allowNull: false,
    validate: {
      notEmpty: { msg: &#039;Title cannot be empty&#039; }
    }
  },

  // Notification message
  message: {
    type: DataTypes.TEXT,
    allowNull: false,
    validate: {
      notEmpty: { msg: &#039;Message cannot be empty&#039; }
    }
  },

  // Related entity (optional)
  related_type: {
    type: DataTypes.STRING(50),
    allowNull: true,
    comment: &#039;Type of related entity: student, grade, attendance, etc.&#039;
  },

  related_id: {
    type: DataTypes.UUID,
    allowNull: true,
    comment: &#039;ID of related entity&#039;
  },

  // Priority level
  priority: {
    type: DataTypes.ENUM(&#039;low&#039;, &#039;medium&#039;, &#039;high&#039;, &#039;urgent&#039;),
    defaultValue: &#039;medium&#039;
  },

  // Read status
  is_read: {
    type: DataTypes.BOOLEAN,
    defaultValue: false
  },

  // Read at timestamp
  read_at: {
    type: DataTypes.DATE,
    allowNull: true
  },

  // Email sent status
  email_sent: {
    type: DataTypes.BOOLEAN,
    defaultValue: false
  },

  email_sent_at: {
    type: DataTypes.DATE,
    allowNull: true
  },

  // Push notification sent
  push_sent: {
    type: DataTypes.BOOLEAN,
    defaultValue: false
  },

  push_sent_at: {
    type: DataTypes.DATE,
    allowNull: true
  },

  // Additional metadata (JSON)
  metadata: {
    type: DataTypes.JSONB,
    allowNull: true,
    defaultValue: {}
  },

  // Expiry date (optional)
  expires_at: {
    type: DataTypes.DATE,
    allowNull: true
  }

}, {
  tableName: &#039;notifications&#039;,
  timestamps: true,
  underscored: true,
  indexes: [
    {
      fields: [&#039;user_id&#039;]
    },
    {
      fields: [&#039;type&#039;]
    },
    {
      fields: [&#039;is_read&#039;]
    },
    {
      fields: [&#039;created_at&#039;]
    },
    {
      fields: [&#039;user_id&#039;, &#039;is_read&#039;]
    }
  ]
});

/**
 * Mark notification as read
 */
Notification.prototype.markAsRead = async function() {
  this.is_read = true;
  this.read_at = new Date();
  await this.save();
  return this;
};

/**
 * Mark notification as sent via email
 */
Notification.prototype.markEmailSent = async function() {
  this.email_sent = true;
  this.email_sent_at = new Date();
  await this.save();
  return this;
};

/**
 * Mark notification as sent via push
 */
Notification.prototype.markPushSent = async function() {
  this.push_sent = true;
  this.push_sent_at = new Date();
  await this.save();
  return this;
};

/**
 * Check if notification is expired
 */
Notification.prototype.isExpired = function() {
  if (!this.expires_at) return false;
  return new Date() &gt; new Date(this.expires_at);
};

/**
 * Static method: Get unread count for user
 */
Notification.getUnreadCount = async function(userId) {
  return await this.count({
    where: {
      user_id: userId,
      is_read: false
    }
  });
};

/**
 * Static method: Mark all as read for user
 */
Notification.markAllAsRead = async function(userId) {
  return await this.update(
    {
      is_read: true,
      read_at: new Date()
    },
    {
      where: {
        user_id: userId,
        is_read: false
      }
    }
  );
};

/**
 * Static method: Delete old notifications
 */
Notification.deleteOldNotifications = async function(days = 30) {
  const cutoffDate = new Date();
  cutoffDate.setDate(cutoffDate.getDate() - days);

  return await this.destroy({
    where: {
      created_at: {
        [sequelize.Sequelize.Op.lt]: cutoffDate
      },
      is_read: true
    }
  });
};

module.exports = Notification;</textarea>
